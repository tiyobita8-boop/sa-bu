<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テニス・サーブゲーム</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#102129;color:#eef5ef;font-family:system-ui,sans-serif}
main{max-width:1150px;margin:auto;padding:24px}
h1{margin:0 0 8px;font-size:28px;color:#d0ee91}
.description{color:#acbfc6;font-size:14px;line-height:1.7}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;margin-top:20px}
.stage{background:#17393c;border:1px solid #456167;border-radius:16px;overflow:hidden}
canvas{width:100%;display:block;aspect-ratio:850/690;touch-action:none;cursor:crosshair}
.panel{background:#1c3039;border:1px solid #40545e;border-radius:16px;padding:18px}
h2{font-size:14px;margin:0 0 12px}
.shots{display:grid;gap:7px}
button,select{font:inherit}
button{cursor:pointer}
.shot{padding:10px;background:#15262e;color:#e2ece8;border:1px solid #4a616a;border-radius:8px;text-align:left;display:flex;justify-content:space-between;font-size:13px}
.shot.active{background:#d0ee91;color:#142b25;border-color:#d0ee91}
select{width:100%;background:#13262e;color:white;border:1px solid #536e78;border-radius:7px;padding:10px}
.section{margin-top:22px}
.meter{position:relative;height:17px;border-radius:9px;margin:20px 0;background:linear-gradient(90deg,#526c77 0 38%,#9eba78 38% 46%,#d4f58c 46% 54%,#9eba78 54% 62%,#526c77 62%)}
#needle{position:absolute;left:50%;top:-4px;height:25px;width:3px;background:#fff}
#serve{width:100%;padding:14px;border:0;border-radius:9px;background:#d0ee91;color:#183126;font-weight:bold}
#message{min-height:64px;line-height:1.7;font-size:14px;color:#d5e9bb;margin-top:14px}
.stats{display:flex;justify-content:space-between;margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid #40545e}
.stats strong{font-size:22px;color:#d0ee91}
.stats small{display:block;font-size:11px;color:#afc3c9}
.note{font-size:11px;color:#9ab0b9;line-height:1.7}
#reset{border:1px solid #607980;color:#d7e7e4;background:transparent;padding:9px;border-radius:7px;width:100%}
@media(max-width:800px){main{padding:14px}.layout{grid-template-columns:1fr}.shots{grid-template-columns:1fr 1fr}h1{font-size:23px}}
</style>
</head>
<body>
<main>
<h1>🎾 テニス・サーブゲーム</h1>
<div class="description">
右利きの7球種を打ち分けよう！<br>
① 点線内をクリック／ドラッグしてターゲットを配置<br>
② 球種を選ぶ → ③ トス → 中央に合わせてもう一度押す
</div>
<div class="layout">
<div class="stage">
<canvas id="court" width="850" height="690" aria-label="相手側のサービスボックスをクリックしてターゲットを配置できます"></canvas>
</div>
<aside class="panel">
<div class="stats">
<div><strong id="score">0</strong><small>得点</small></div>
<div><strong id="hits">0 / 0</strong><small>命中 / サーブ数</small></div>
</div>
<h2>球種を選ぶ</h2>
<div class="shots" id="shots"></div>
<div class="section">
<h2>サーブを打つ位置</h2>
<select id="side" aria-label="サーブを打つ位置">
<option value="deuce">デュースサイド（右側から）</option>
<option value="ad">アドサイド（左側から）</option>
</select>
</div>
<div class="section">
<h2>タイミング</h2>
<div class="note">中央の明るいゾーンを狙ってインパクト！</div>
<div class="meter"><div id="needle"></div></div>
<button id="serve">トスを上げる［Space］</button>
<div id="message" role="status" aria-live="polite">ターゲットを置いてサーブを打とう！</div>
</div>
<button id="reset">スコアをリセット</button>
<p class="note">
角度はバウンド後の進行方向の変化を表すゲーム設定です。
90°のスライスは誇張表現です。球速は設定値であり、
実際のテニスを正確に再現する物理シミュレーターではありません。
</p>
</aside>
</div>
</main>
<script>
"use strict";

const canvas = document.getElementById("court");
const ctx = canvas.getContext("2d");
const el = id => document.getElementById(id);
const types = [
  {name:"スライス90°", angle:90, speed:125, color:"#ebcc85"},
  {name:"スライス45°", angle:45, speed:145, color:"#ebcc85"},
  {name:"スライス10°", angle:10, speed:160, color:"#ebcc85"},
  {name:"跳ねるスピン", angle:0, speed:140, color:"#9ee1da", spin:true},
  {name:"高速スライス30°", angle:30, speed:190, color:"#ebcc85"},
  {name:"逆キック10°", angle:-10, speed:155, color:"#c3a7ef", spin:true},
  {name:"高速フラット", angle:0, speed:215, color:"#f2ae9c"}
];

let selected = 1;
let side = "deuce";
let target = {x:300, y:240};
let phase = "idle";
let tossStart = 0;
let meterValue = 0.5;
let flight = null;
let trail = [];
let score = 0;
let hits = 0;
let attempts = 0;
let lastLanding = null;
let dragging = false;

function serviceBox() {
  return side === "deuce"
    ? {left:205, right:425, top:165, bottom:340}
    : {left:425, right:645, top:165, bottom:340};
}

function serverPosition() {
  return {x:side === "deuce" ? 500 : 350, y:600};
}

function renderTypes() {
  const container = el("shots");
  container.replaceChildren();
  types.forEach((type,index) => {
    const button = document.createElement("button");
    button.className = "shot" + (index === selected ? " active" : "");
    button.setAttribute("aria-pressed", String(index === selected));
    const name = document.createElement("span");
    name.textContent = type.name;
    const arrow = document.createElement("b");
    arrow.textContent = type.angle < 0 ? "↗" :
      type.angle > 0 ? "↖" : type.spin ? "↑↑" : "↑";
    button.append(name,arrow);
    button.onclick = () => {
      if(phase !== "idle") return;
      selected = index;
      renderTypes();
    };
    container.append(button);
  });
}

function line(x1,y1,x2,y2,color="#deebe3",width=2) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

function circle(x,y,r,color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

function ellipse(x,y,rx,ry,color,width=2) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.stroke();
}

function drawCourt() {
  ctx.fillStyle = "#17393c";
  ctx.fillRect(0,0,850,690);
  ctx.fillStyle = "#21504f";
  ctx.fillRect(125,65,600,560);
  ctx.fillStyle = "#347477";
  ctx.fillRect(150,90,550,500);
  ctx.fillStyle = "#3c7e80";
  ctx.fillRect(205,165,440,350);

  [150,205,645,700].forEach(x => line(x,90,x,590));
  line(150,90,700,90);
  line(150,590,700,590);
  line(205,165,645,165);
  line(205,515,645,515);
  line(425,165,425,515);
  line(425,90,425,82);
  line(425,590,425,598);

  const box = serviceBox();
  ctx.fillStyle = "#d0ee911b";
  ctx.fillRect(box.left,box.top,box.right-box.left,box.bottom-box.top);
  ctx.setLineDash([6,6]);
  ctx.strokeStyle = "#d0ee9199";
  ctx.lineWidth = 2;
  ctx.strokeRect(box.left+5,box.top+5,
    box.right-box.left-10,box.bottom-box.top-10);
  ctx.setLineDash([]);

  ctx.fillStyle = "#d2e8df";
  ctx.font = "14px system-ui";
  ctx.fillText("ターゲットを点線内に置こう",30,38);
  ctx.fillStyle = "#b1cfc6";
  ctx.font = "12px system-ui";
  ctx.fillText("相手コート",380,58);
  ctx.fillText("右利きサーバー",355,662);

  line(138,340,712,340,"#102129",10);
  line(138,336,712,336,"#eef5e8",3);
  for(let x=145;x<712;x+=13) {
    line(x,340,x,353,"#d5e9df55",1);
  }

  ellipse(target.x,target.y,25,15,"#d5f391");
  ellipse(target.x,target.y,12,7,"#d5f391");
  line(target.x-32,target.y,target.x+32,target.y,"#d5f39188",1);
  line(target.x,target.y-22,target.x,target.y+22,"#d5f39188",1);

  if(lastLanding) {
    circle(lastLanding.x,lastLanding.y,5,
      lastLanding.hit ? "#d5f391" : "#f4a18e");
  }
}

function drawServer() {
  const p = serverPosition();
  circle(p.x,p.y,11,"#e2eadd");
  line(p.x,p.y+10,p.x,p.y+30,"#e2eadd",6);
  line(p.x,p.y+30,p.x-10,p.y+43,"#e2eadd",4);
  line(p.x,p.y+30,p.x+10,p.y+43,"#e2eadd",4);
  line(p.x,p.y+18,p.x+23,p.y+2,"#d0ee91",4);
  ctx.save();
  ctx.translate(p.x+29,p.y-7);
  ctx.rotate(-0.4);
  ellipse(0,0,8,13,"#d0ee91",3);
  ctx.restore();
}

function ballPosition(t) {
  const f = flight;
  if(t <= 1) {
    return {
      x:f.startPoint.x+(f.landing.x-f.startPoint.x)*t+
        Math.sin(Math.PI*t)*f.curve,
      y:f.startPoint.y+(f.landing.y-f.startPoint.y)*t,
      z:Math.sin(Math.PI*t)*100+35*(1-t)
    };
  }
  const u = t-1;
  const distance = u*240;
  const angle = f.type.angle*Math.PI/180;
  return {
    x:f.landing.x-Math.sin(angle)*distance,
    y:f.landing.y-Math.cos(angle)*distance,
    z:Math.sin(Math.PI*Math.min(u/0.85,1))*
      (f.type.spin ? 135 : 40)
  };
}

function updateStats() {
  el("score").textContent = score;
  el("hits").textContent = hits+" / "+attempts;
}

function judgeLanding() {
  const p = flight.landing;
  const box = serviceBox();
  const inside = p.x >= box.left && p.x <= box.right &&
    p.y >= box.top && p.y <= box.bottom;
  const distance = Math.hypot(
    p.x-flight.target.x,
    (p.y-flight.target.y)*1.4
  );
  const hit = inside && distance <= 25;
  attempts++;
  let points = 0;
  if(hit) {
    hits++;
    points = Math.max(50,Math.round(100-distance*2));
  } else if(inside) {
    points = 20;
  }
  score += points;
  lastLanding = {x:p.x,y:p.y,hit};
  updateStats();
  const result = hit ? "🎯 ターゲット命中！ +"+points :
    inside ? "✓ サービスイン！ +20" : "フォルト！";
  el("message").textContent =
    result+"　"+flight.type.speed+" km/h（設定値）";
}

function serve() {
  if(phase === "flight") return;
  if(phase === "idle") {
    phase = "toss";
    tossStart = performance.now();
    meterValue = 0.5;
    el("serve").textContent = "インパクト！［Space］";
    el("message").textContent = "中央の明るいゾーンで止めよう！";
    return;
  }
  const error = (meterValue-0.5)*2;
  const type = types[selected];
  flight = {
    type,
    startPoint:serverPosition(),
    landing:{
      x:target.x+error*95,
      y:target.y+Math.abs(error)*55
    },
    target:{...target},
    curve:-type.angle*0.6,
    startTime:performance.now(),
    duration:1450*160/type.speed,
    judged:false
  };
  trail = [];
  phase = "flight";
  el("serve").textContent = "サーブ中…";
}

function animate(time) {
  ctx.clearRect(0,0,850,690);
  drawCourt();
  drawServer();

  if(phase === "toss") {
    meterValue = (Math.sin((time-tossStart)/340)+1)/2;
    el("needle").style.left = (meterValue*100)+"%";
    const p = serverPosition();
    const height = 40+Math.abs(Math.sin((time-tossStart)/500))*75;
    circle(p.x+20,p.y-height,6,"#e6f59a");
  }

  if(flight) {
    const t = (time-flight.startTime)/flight.duration;
    const p = ballPosition(Math.min(t,1.85));
    trail.push(p);
    if(trail.length > 65) trail.shift();
    trail.forEach((point,index) => {
      circle(point.x,point.y-point.z,2.2,
        "rgba(217,241,145,"+(index/trail.length*0.65)+")");
    });
    ctx.fillStyle = "#081a2855";
    ctx.beginPath();
    ctx.ellipse(p.x,p.y,8,4,0,0,Math.PI*2);
    ctx.fill();
    circle(p.x,p.y-p.z,7,flight.type.color);
    line(p.x-4,p.y-p.z-3,p.x+3,p.y-p.z+4,"#ffffffaa",1);

    if(t >= 1 && !flight.judged) {
      flight.judged = true;
      judgeLanding();
    }
    if(t >= 1.85) {
      flight = null;
      phase = "idle";
      el("serve").textContent = "もう一球打つ［Space］";
    }
  }
  requestAnimationFrame(animate);
}

function moveTarget(event) {
  if(phase !== "idle") return;
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX-rect.left)*canvas.width/rect.width;
  const y = (event.clientY-rect.top)*canvas.height/rect.height;
  const box = serviceBox();
  if(x >= box.left && x <= box.right &&
     y >= box.top && y <= box.bottom) {
    target = {x,y};
  }
}

canvas.addEventListener("pointerdown",event => {
  dragging = true;
  canvas.setPointerCapture(event.pointerId);
  moveTarget(event);
});
canvas.addEventListener("pointermove",event => {
  if(dragging) moveTarget(event);
});
canvas.addEventListener("pointerup",() => dragging=false);
canvas.addEventListener("pointercancel",() => dragging=false);
el("serve").addEventListener("click",serve);

document.addEventListener("keydown",event => {
  if(event.code !== "Space" || event.repeat) return;
  const tag = document.activeElement.tagName;
  if(["SELECT","INPUT","TEXTAREA"].includes(tag)) return;
  if(tag === "BUTTON" && document.activeElement !== el("serve")) return;
  event.preventDefault();
  serve();
});

el("side").addEventListener("change",event => {
  if(phase !== "idle") {
    event.target.value = side;
    return;
  }
  side = event.target.value;
  target.x = 850-target.x;
  lastLanding = null;
});

el("reset").addEventListener("click",() => {
  score = 0;
  hits = 0;
  attempts = 0;
  phase = "idle";
  flight = null;
  trail = [];
  lastLanding = null;
  el("needle").style.left = "50%";
  el("serve").textContent = "トスを上げる［Space］";
  el("message").textContent = "スコアをリセットしました。";
  updateStats();
});

renderTypes();
requestAnimationFrame(animate);
</script>
</body>
</html>
